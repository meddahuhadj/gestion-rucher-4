  if (window.playablesSDK) return;

  var ANDROID_BRIDGE_NAME = '_MetaPlayablesBridge';
  var RAF_FRAME_THRESHOLD = 3;

  var gameReadySent = false;
  var firstInteractionSent = false;
  var errorSent = false;
  var frameCount = 0;
  var originalRAF = window.requestAnimationFrame;

  function hasIOSBridge() {

              window.webkit.messageHandlers[HANDLER_NAME]);
  }

  function hasAndroidBridge() {
    return !!(window[ANDROID_BRIDGE_NAME] &&
              typeof window[ANDROID_BRIDGE_NAME].postEvent === 'function');
  }

  function isInIframe() {
    return !!(window.parent && window.parent !== window);
  }

  function sendEvent(eventName, payload) {
    var message = {
      type: eventName,
      payload: payload || {},
      timestamp: Date.now()
    };

    if (hasIOSBridge()) {
      try {
        window.webkit.messageHandlers[HANDLER_NAME].postMessage(message);
      } catch (e) { /* ignore */ }
      return;
    }

        eventName,
        JSON.stringify(p)
      );
    } catch (e) { /* ignore */ }
    return;
  }

    if (isInIframe()) {
      try {
        window.parent.postMessage(message, '*');
      } catch (e) { /* ignore */ }
      return;
    }
  }

  // --- rAF Game-Ready Detection ---

  function onFrame() {
    if (gameReadySent) return;

    frameCount++;
    if (frameCount >= RAF_FRAME_THRESHOLD) {
      gameReadySent = true;
      sendEvent('game_ready', {
        frame_count: frameCount,
        detected_at: Date.now()
      });
      return;
    }

    originalRAF.call(window, onFrame);
  }

  if (originalRAF) {
    window.requestAnimationFrame = function(callback) {
      if (!gameReadySent) {
        return originalRAF.call(window, function(timestamp) {
          frameCount++;
          if (frameCount >= RAF_FRAME_THRESHOLD && !gameReadySent) {
            gameReadySent = true;
            sendEvent('game_ready', {
              frame_count: frameCount,
              detected_at: Date.now()
            });
          }
          callback(timestamp);
        });
      }
      return originalRAF.call(window, callback);
    };

    function onFirstInteraction() {

      firstInteractionSent = true;
      sendEvent('user_interaction_start', null);

      for (var i = 0; i < events.length; i++) {

    // Utilitaires audio
    function encode(bytes) {
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }
    
    function decode(base64) {
      const binaryString = atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes;
    }
    
    async function decodeAudioData(data, ctx, sampleRate, numChannels) {
      const dataInt16 = new Int16Array(data.buffer);
      const frameCount = dataInt16.length / numChannels;
      const buffer = ctx.createBuffer(numChannels, frameCount, sampleRate);
      
      for (let channel = 0; channel < numChannels; channel++) {
        const channelData = buffer.getChannelData(channel);
        for (let i = 0; i < frameCount; i++) {
          channelData[i] = dataInt16[i * numChannels + channel] / 32768.0;
        }
      }
      return buffer;
    }
    
    function createPcmBlob(data) {
      const l = data.length;
      const int16 = new Int16Array(l);
      for (let i = 0; i < l; i++) {
        int16[i] = Math.max(-1, Math.min(1, data[i])) * 32767;
      }
      return {
        data: encode(new Uint8Array(int16.buffer)),
        mimeType: 'audio/pcm;rate=16000',
      };
    }
    
    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const base64String = reader.result.split(',')[1];
          resolve(base64String);
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }
    
    // Mise à jour de l'UI
    function updateStatus(newStatus) {
      state.status = newStatus;
      elements.statusText.textContent = newStatus;
      elements.statusDot.classList.toggle('active', newStatus !== 'IDLE');
      
      elements.statusMessage.className = 'status-message ' + newStatus.toLowerCase();
      elements.statusMessage.textContent = {
        'IDLE': '',
        'CONNECTING': 'Initialisation...',
        'LISTENING': 'Je vous écoute...',
        'SPEAKING': 'Gemini parle...',
        'ERROR': 'Erreur de connexion'
      }[newStatus] || '';
      
      elements.videoContainer.classList.toggle('active', newStatus !== 'IDLE');
      elements.videoOverlay.style.display = newStatus === 'IDLE' ? 'flex' : 'none';
      
      elements.visualizerCore.className = 'visualizer-core';
      if (newStatus === 'SPEAKING') elements.visualizerCore.classList.add('speaking');
      if (newStatus === 'LISTENING') elements.visualizerCore.classList.add('listening');

    function updateTools() {
      const html = [];
      
      state.alarms.forEach(alarm => {
        html.push(`

          </div>
        `);
      });
      
      if (state.weather) {
        html.push(`
          <div class="tool-card weather">
            <span>🌤️</span>
            <span>${state.weather.location}: ${state.weather.temp} - ${state.weather.condition}</span>

    }
    
    function updateTranscriptions() {
      if (state.transcriptions.length === 0) {
        elements.transcriptionContainer.innerHTML = '<div class="transcription-empty">La transcription apparaîtra ici...</div>';
        return;
      }
      
      const html = state.transcriptions.map(entry => `
        <div class="transcription-entry ${entry.role}">
          <div class="transcription-label">${entry.role === 'user' ? 'Vous' : 'Gemini'}</div>
          <div class="transcription-bubble">${entry.text}</div>
        </div>
      `).join('');
      
      elements.transcriptionContainer.innerHTML = html;
      elements.transcriptionContainer.scrollTop = elements.transcriptionContainer.scrollHeight;
    }
    
    // Gestion des outils
    async function handleFunctionCall(fc) {
      console.log('Function call:', fc);
      
      if (fc.name === 'setAlarm') {
        const { time, label } = fc.args;
        const newAlarm = { id: Math.random().toString(36).substr(2, 5), time, label };
        state.alarms.push(newAlarm);
        updateTools();
        return { status: 'success', message: `Alarme réglée pour ${time}${label ? ` (${label})` : ''}` };
      }
      
      if (fc.name === 'getWeather') {
        const { location } = fc.args;
        const conditions = ['Ensoleillé', 'Nuageux', 'Pluvieux', 'Venteux'];
        const temp = Math.floor(Math.random() * 15 + 10) + '°C';
        const condition = conditions[Math.floor(Math.random() * conditions.length)];
        
        state.weather = { location, temp, condition };
        updateTools();
        return { status: 'success', location, temperature: temp, condition };
      }
      
      return { error: 'Fonction inconnue' };
    }
    
    window.removeAlarm = (id) => {
      state.alarms = state.alarms.filter(a => a.id !== id);
      updateTools();
    };
    
    window.removeWeather = () => {
      state.weather = null;
      updateTools();
    };
    
    // Session
    async function startSession() {
      if (!state.apiKey) {
        elements.apiKeyPrompt.style.display = 'flex';
        return;
      }
      
      try {
        updateStatus('CONNECTING');
        
        state.audioContextIn = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        state.audioContextOut = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        state.nextStartTime = 0;
        
        const ai = new GoogleGenAI({ apiKey: state.apiKey });
        
        state.mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: { width: { ideal: 640 }, height: { ideal: 480 } }
        });
        
        elements.video.srcObject = state.mediaStream;
        
        state.session = await ai.live.connect({
          model: 'gemini-2.5-flash-native-audio-preview-09-2025',
          callbacks: {
            onopen: () => {
              console.log('Session ouverte');
              updateStatus('LISTENING');
              
              // Audio
              const audioSource = state.audioContextIn.createMediaStreamSource(state.mediaStream);
              const scriptProcessor = state.audioContextIn.createScriptProcessor(4096, 1, 1);
              
              scriptProcessor.onaudioprocess = (e) => {
                const inputData = e.inputBuffer.getChannelData(0);
                const pcmBlob = createPcmBlob(inputData);
                state.session?.sendRealtimeInput({ media: pcmBlob });
              };
              
              audioSource.connect(scriptProcessor);
              scriptProcessor.connect(state.audioContextIn.destination);
              
              // Vidéo
              state.frameInterval = setInterval(() => {
                if (elements.video.readyState >= 2) {
                  const ctx = elements.canvas.getContext('2d');
                  elements.canvas.width = elements.video.videoWidth;
                  elements.canvas.height = elements.video.videoHeight;
                  ctx.drawImage(elements.video, 0, 0);
                  
                  elements.canvas.toBlob(async (blob) => {
                    if (blob) {
                      const base64 = await blobToBase64(blob);
                      state.session?.sendRealtimeInput({
                        media: { data: base64, mimeType: 'image/jpeg' }
                      });
                    }
                  }, 'image/jpeg', 0.6);
                }
              }, 1000);
            },
            onmessage: async (message) => {
              // Tool calls
              if (message.toolCall) {
                for (const fc of message.toolCall.functionCalls) {
                  const result = await handleFunctionCall(fc);
                  state.session?.sendToolResponse({
                    functionResponses: { id: fc.id, name: fc.name, response: { result } }
                  });
                }
              }
              
              // Transcription
              if (message.serverContent?.outputTranscription) {
                state.currentOutputTranscription += message.serverContent.outputTranscription.text;
              }
              if (message.serverContent?.inputTranscription) {
                state.currentInputTranscription += message.serverContent.inputTranscription.text;
              }
              
              if (message.serverContent?.turnComplete) {
                const userText = state.currentInputTranscription.trim();
                const agentText = state.currentOutputTranscription.trim();
                
                if (userText) {
                  state.transcriptions.push({
                    id: Math.random().toString(36).substr(2, 9),
                    role: 'user',
                    text: userText,
                    timestamp: Date.now()
                  });
                }
                if (agentText) {
                  state.transcriptions.push({
                    id: Math.random().toString(36).substr(2, 9),
                    role: 'agent',
                    text: agentText,
                    timestamp: Date.now()
                  });
                }
                
                updateTranscriptions();
                state.currentInputTranscription = '';
                state.currentOutputTranscription = '';
                updateStatus('LISTENING');
              }
              
              // Audio
              const base64Audio = message.serverContent?.modelTurn?.parts[0]?.inlineData?.data;
              if (base64Audio) {
                updateStatus('SPEAKING');
                const ctx = state.audioContextOut;
                state.nextStartTime = Math.max(state.nextStartTime, ctx.currentTime);
                
                const audioBuffer = await decodeAudioData(decode(base64Audio), ctx, 24000, 1);
                const source = ctx.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(ctx.destination);
                source.addEventListener('ended', () => state.activeSources.delete(source));
                source.start(state.nextStartTime);
                state.nextStartTime += audioBuffer.duration;
                state.activeSources.add(source);
              }
              
              if (message.serverContent?.interrupted) {
                state.activeSources.forEach(s => s.stop());
                state.activeSources.clear();
                state.nextStartTime = 0;
                updateStatus('LISTENING');
              }
            },
            onerror: (e) => {
              console.error('Erreur:', e);
              updateStatus('ERROR');
              stopSession();
            },
            onclose: () => {
              console.log('Session fermée');
              stopSession();
            }
          },
          config: {
            responseModalities: ['AUDIO'],
            speechConfig: {
              voiceConfig: { prebuiltVoiceConfig: { voiceName: 'Kore' } }
            },
            systemInstruction: 'Tu es un assistant vocal intelligent et amical avec capacités visuelles. Tu peux voir l\'utilisateur. Tu as des outils pour régler des alarmes et vérifier la météo. Réponds naturellement et garde tes réponses brèves. Si l\'utilisateur demande la météo ou de régler une alarme, utilise les outils fournis.',
            tools: [{
              functionDeclarations: [
                {
                  name: 'setAlarm',
                  description: 'Règle une alarme à une heure spécifique.',
                  parameters: {
                    type: 'OBJECT',
                    properties: {
                      time: { type: 'STRING', description: 'L\'heure de l\'alarme (ex: "08:00", "20h")' },
                      label: { type: 'STRING', description: 'Un label optionnel pour l\'alarme' }
                    },
                    required: ['time']
                  }
                },
                {
                  name: 'getWeather',
                  description: 'Obtient la météo actuelle pour un lieu.',
                  parameters: {
                    type: 'OBJECT',
                    properties: {
                      location: { type: 'STRING', description: 'La ville et le pays (ex: "Paris, France")' }
                    },
                    required: ['location']
                  }
                }
              ]
            }],
            inputAudioTranscription: {},
            outputAudioTranscription: {}
          }
        });
        
      } catch (err) {
        console.error('Erreur démarrage:', err);
        updateStatus('ERROR');
        alert('Impossible d\'accéder à la caméra/micro ou de se connecter à l\'API');
      }
    }
    
    async function stopSession() {
      if (state.frameInterval) {
        clearInterval(state.frameInterval);
        state.frameInterval = null;
      }
      
      if (state.session) {
        state.session.close();
        state.session = null;
      }
      
      if (state.mediaStream) {
        state.mediaStream.getTracks().forEach(track => track.stop());
        state.mediaStream = null;
      }
      
      if (state.audioContextIn) {
        await state.audioContextIn.close();
        state.audioContextIn = null;
      }
      
      if (state.audioContextOut) {
        await state.audioContextOut.close();
        state.audioContextOut = null;
      }
      
      state.activeSources.forEach(s => s.stop());
      state.activeSources.clear();
      
      updateStatus('IDLE');
    }
    
    // Contrôles
    elements.controlBtn.addEventListener('click', async () => {
      if (state.status === 'IDLE' || state.status === 'ERROR') {
        elements.controlBtn.disabled = true;
        await startSession();
        elements.controlBtn.disabled = false;
        elements.controlBtn.className = 'stop';
        elements.btnText.textContent = 'Arrêter l\'Assistant';
        elements.controlBtn.innerHTML = `
          <svg fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clip-rule="evenodd" />
          </svg>
          <span>Arrêter l'Assistant</span>
        `;
      } else {
        await stopSession();
        elements.controlBtn.className = 'start';
        elements.btnText.textContent = 'Démarrer l\'Assistant';
        elements.controlBtn.innerHTML = `
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          <span>Démarrer l'Assistant</span>
        `;
      }
    });
    
    window.saveApiKey = () => {
      const key = elements.apiKeyInput.value.trim();
      if (key) {
        state.apiKey = key;
        localStorage.setItem('gemini_api_key', key);
        elements.apiKeyPrompt.style.display = 'none';
        startSession();
      }
    };
    
    // Initialisation
    updateStatus('IDLE');
    updateTools();
    updateTranscriptions();
    
    // Service Worker pour PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('data:text/javascript;base64,c2VsZi5hZGRFdmVudExpc3RlbmVyKCdpbnN0YWxsJywgZSA9PiBzZWxmLnNraXBXYWl0aW5nKCkpOw==');
    }
  </script>
