<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#b07414" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b07414" />
    <meta name="description" content="Copilote numérique intelligent pour apiculteur — MOUMEN Apiary AI" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MOUMEN" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>MOUMEN Apiary AI</title>
    <script>
      // langue + direction avant le premier rendu (évite un flash LTR en arabe)
      try {
        var l = localStorage.getItem("moumen.locale");
        if (l) {
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
