# ===================================================================
# Render Blueprint — MOUMEN Apiary AI (offre gratuite).
#
#   Dashboard Render → New + → Blueprint → choisir le repo → Apply.
#
# Crée 2 ressources :
#   1. gestion-rucher-api  — API Fastify (free web service, région frankfurt)
#   2. moumen-web           — front React/PWA (static site, CDN global, gratuit)
#
# La base de données est **Supabase Postgres** (pas de Postgres Render : la
# limite « 1 seule base free par compte » est déjà atteinte, et le free Render
# expire à 90 j). Les URLs sont à coller dans le dashboard (sync: false).
#
# Variables secrètes à saisir dans l'onglet Environment de gestion-rucher-api :
#   - DATABASE_URL   (Supabase pooler transaction, :6543, + ?pgbouncer=true)
#   - DIRECT_URL     (Supabase direct, :5432)
#   - GEMINI_API_KEY (Google AI Studio)
#
# Le front appelle /api/* → réécrit vers l'API (same-origin, pas de CORS).
# Auth : pas de Supabase Auth pour l'instant → bouton « connexion dev » (voir
# ALLOW_DEBUG_AUTH + VITE_ALLOW_DEV_LOGIN).
#
# ⚠️ Si Render ajoute un suffixe aléatoire à un nom (nom déjà pris), l'URL
#    du proxy ci-dessous sera fausse : me donner les vraies URLs, je corrige.
# ===================================================================

services:
  # ---------------------------------------------------------------
  # API — Fastify + Prisma
  # ---------------------------------------------------------------
  - type: web
    name: gestion-rucher-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @moumen/shared build &&
      pnpm --filter @moumen/api exec prisma generate &&
      pnpm --filter @moumen/api build
    # Au démarrage : synchronise le schéma sur la base (idempotent, no-op si à
    # jour) puis lance le serveur. @moumen/shared est compilé en JS (dist/) à
    # l'étape build, donc `node` suffit.
    startCommand: >-
      pnpm --filter @moumen/api exec prisma db push --skip-generate &&
      node apps/api/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # ── À coller dans le dashboard (onglet Environment) ──
      # DATABASE_URL = Supabase → Settings → Database → Connection pooling
      #   (Transaction, :6543), ajouter ?pgbouncer=true à la fin.
      - key: DATABASE_URL
        sync: false
      # DIRECT_URL = Supabase → Direct connection (:5432). Utilisé par
      #   `prisma db push` au démarrage.
      - key: DIRECT_URL
        sync: false
      # Auth : accepte l'en-tête X-Debug-User (déploiement privé sans Supabase).
      - key: ALLOW_DEBUG_AUTH
        value: "true"
      # Valeurs publiques du projet Supabase (utile si on rebranche l'auth plus tard).
      - key: SUPABASE_URL
        value: https://qqnzsttvgbasukbfcgzq.supabase.co
      - key: SUPABASE_JWT_JWKS_URL
        value: https://qqnzsttvgbasukbfcgzq.supabase.co/auth/v1/.well-known/jwks.json
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_LIVE_MODEL
        value: gemini-2.5-flash-native-audio-preview-09-2025
      # Domaine du front (Vercel). À ajuster avec l'URL réelle du projet Vercel
      # si le proxy same-origin de vercel.json venait à ne pas suffire.
      - key: CORS_ORIGINS
        value: https://gestion-rucher-4.vercel.app
      - key: RATE_LIMIT_AI_PER_MIN
        value: "20"
      - key: LOG_LEVEL
        value: info

  # Le front (apps/web) est déployé sur **Vercel** (voir apps/web/vercel.json) :
  # Vercel gère nativement le monorepo pnpm, contrairement au build static Render
  # (FS /usr/bin en lecture seule → corepack, versions Node, etc.). Le proxy
  # /api/* → API Render est fait par vercel.json, donc same-origin, pas de CORS.
